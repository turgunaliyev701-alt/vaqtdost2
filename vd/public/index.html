<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10172a"><title>VaqtDost 2.0</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--mut:#6b7488;--line:#e6eaf2;--pri:#4267f5;--pri2:#e9edff;--green:#16a36a;--orange:#f59b32;--red:#e4505d;--nav:#11182b;--shadow:0 8px 24px rgba(25,40,80,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}main{max-width:600px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:850;font-size:22px;letter-spacing:-.6px}.brand span{color:var(--pri)}.avatar{width:40px;height:40px;border-radius:14px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:800}.greeting{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:8px 0 2px}.muted{color:var(--mut);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#4267f5,#6b8aff);color:white;border:0;padding:18px}.hero .muted{color:#e3e9ff}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.level{background:#ffffff24;border:1px solid #ffffff44;border-radius:30px;padding:6px 10px;font-size:12px;font-weight:700}.xpbar{height:8px;background:#ffffff40;border-radius:20px;margin:14px 0 6px;overflow:hidden}.xpbar i{display:block;background:#fff;height:100%;border-radius:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px 10px;text-align:center}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:var(--mut)}h2{font-size:18px;margin:22px 0 10px}h3{font-size:15px;margin:0 0 5px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.pill{font-size:11px;font-weight:700;border-radius:30px;padding:5px 8px;background:#f0f2f8;color:var(--mut)}.priority{width:5px;align-self:stretch;border-radius:5px;flex:none}.p3{background:var(--red)}.p2{background:var(--orange)}.p1{background:var(--pri)}.task{display:flex;gap:10px;align-items:center}.taskinfo{flex:1;min-width:0}.tasktitle{font-weight:700;overflow-wrap:anywhere}.taskmeta{font-size:12px;color:var(--mut)}.done .tasktitle{text-decoration:line-through;color:var(--mut)}.check{width:27px;height:27px;border:2px solid var(--line);background:white;border-radius:50%;color:white;cursor:pointer;flex:none}.check.checked{background:var(--green);border-color:var(--green)}.del{border:0;background:none;color:#9aa2b4;font-size:19px;cursor:pointer}.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:12px 14px;font-weight:750;cursor:pointer;width:100%}.btn.secondary{background:var(--pri2);color:var(--pri)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formgrid .wide{grid-column:1/-1}input,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 12px;margin:4px 0 8px}.days{display:flex;gap:6px;overflow:auto;margin:8px 0 12px}.days button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:24px;white-space:nowrap}.days button.active{background:var(--pri);color:white;border-color:var(--pri)}.empty{text-align:center;padding:18px;color:var(--mut)}.progress{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--green)}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.navinner{max-width:600px;margin:auto;display:flex}.nav button{flex:1;background:none;border:0;color:#aab3c9;padding:8px 2px;font-size:11px;border-radius:10px}.nav button.active{color:#8fb0ff;font-weight:800}.nav button span{display:block;font-size:18px;margin-bottom:2px}.sectionlabel{font-weight:800}.tip{background:#eef2ff;color:#384eaf;border-radius:14px;padding:13px;font-size:13px}.topiclist{font-size:13px;color:var(--mut);margin-top:7px}.smallbtn{border:0;border-radius:10px;background:#f1f3f8;color:var(--ink);padding:8px 10px;cursor:pointer}.hidden{display:none}
</style></head>
<body><main id="app"></main><nav class="nav"><div class="navinner" id="nav"></div></nav>
<script>
async function rpc(fn,args){const r=await fetch('/api/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||'Server xatosi');return d}
async function createClassRemote(name,pw){try{let r=await rpc('create_class',{p_name:name,p_password:pw});S.classes.push({id:r.code,name,code:r.code,ownerKey:r.owner_key,tasks:[]});save();render();alert('Sinf yaratildi! Kod: '+r.code+' | Parolni o‘quvchilarga ulashing.')}catch(e){alert('Xato: '+e.message)}}
async function pushTasks(c){try{await rpc('set_tasks',{p_code:c.code,p_owner_key:c.ownerKey,p_tasks:c.tasks})}catch(e){alert('Serverga saqlanmadi: '+e.message)}}
async function joinRemote(code,pw){try{let r=await rpc('get_class',{p_code:code,p_password:pw});let j=S.joined.find(x=>x.code===code);if(j){j.name=r.name;j.tasks=r.tasks;j.pw=pw}else S.joined.push({id:code,code,pw,name:r.name,tasks:r.tasks});save();render();alert(r.name+' sinfiga qo‘shildingiz!')}catch(e){alert('Xato: '+e.message)}}
async function refreshJoined(){let ch=false;for(const j of S.joined){try{let r=await rpc('get_class',{p_code:j.code,p_password:j.pw});j.name=r.name;j.tasks=r.tasks;ch=true}catch(e){}}if(ch){save();if(S.tab==='tasks')render()}}
const DAYS=['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba','Yakshanba'];const TABS=[['home','🏠','Bugun'],['schedule','📅','Jadval'],['tasks','✓','Vazifalar'],['exams','🎯','Imtihon'],['stats','🏆','Progress'],['teacher','👩‍🏫','Ustoz']];const PRIOR={3:'Yuqori',2:'O‘rta',1:'Past'};
let S={schedule:{},tasks:[],exams:[],xp:0,completedDates:[],name:'O‘quvchi',classes:[],joinedClasses:[],joined:[]},tab='home',day=(new Date().getDay()+6)%7;
try{let saved=JSON.parse(localStorage.getItem('vaqtdost_v2')||'{}');S={...S,...saved}}catch(e){}
S.tab=S.tab||'home';S.classes=S.classes||[];S.joinedClasses=S.joinedClasses||[];S.joined=S.joined||[];
// Migrate the earlier single-class prototype data.
if(S.classroom?.code&&!S.classes.some(c=>c.code===S.classroom.code)){S.classes.push({...S.classroom,id:S.classroom.id||uid(),password:S.classroom.password||'1234'});S.joinedClasses=S.joinedClasses||[];}
const save=()=>{try{localStorage.setItem('vaqtdost_v2',JSON.stringify(S))}catch(e){}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const today=()=>iso(new Date());const left=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);const dueText=n=>n<0?`${-n} kun kechikdi`:n===0?'Bugun':n===1?'Ertaga':`${n} kun qoldi`;const uid=()=>Math.random().toString(36).slice(2,9);const subjects=()=>[...new Set([...Object.values(S.schedule).flat().map(x=>x.subject),...S.tasks.map(x=>x.subject),...S.exams.map(x=>x.subject)])];
function streak(){let dates=[...new Set(S.completedDates||[])].sort().reverse();let n=0,d=new Date();if(!dates.includes(today()))d.setDate(d.getDate()-1);for(let i=0;i<365;i++){let k=iso(d);if(dates.includes(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function level(){return Math.floor((S.xp||0)/100)+1}function xpInLevel(){return (S.xp||0)%100}
function smartAdvice(){let pending=S.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)||b.prio-a.prio);let urgent=pending.filter(t=>left(t.due)<=2);if(urgent.length)return `Bugun avval <b>${esc(urgent[0].subject)}</b> fanidan “${esc(urgent[0].title)}” vazifasiga ${urgent[0].prio===3?'40':urgent[0].prio===2?'30':'20'} daqiqa ajrating.`;if(pending.length)return `Rejangizda ${pending.length} ta vazifa bor. Eng yaqin muddatli vazifani bugun boshlash yaxshi.`;return 'Ajoyib! Hozircha vazifalar yo‘q. Yangi vazifa qo‘shib rejangizni tuzing.'}
function home(){let pend=S.tasks.filter(t=>!t.done),todayTasks=pend.filter(t=>left(t.due)<=0),ex=S.exams.filter(e=>left(e.date)>=0&&left(e.date)<=7);let lessons=S.schedule[day]||[];return `<div class="top"><div class="brand">Vaqt<span>Dost</span></div><div class="avatar">${esc((S.name||'O').slice(0,1).toUpperCase())}</div></div><div class="greeting">Salom, ${esc(S.name||'O‘quvchi')} 👋</div><p class="muted">Bugun rejangizni birga tartibga solamiz.</p><div class="card hero"><div class="heroTop"><div><div class="muted">Sizning darajangiz</div><strong style="font-size:24px">Level ${level()}</strong></div><span class="level">🔥 ${streak()} kun streak</span></div><div class="xpbar"><i style="width:${xpInLevel()}%"></i></div><div class="row between muted"><span>${S.xp||0} XP</span><span>${xpInLevel()}/100 XP — keyingi level</span></div></div><div class="stats"><div class="card stat"><strong>${pend.length}</strong><span>Vazifalar</span></div><div class="card stat"><strong>${todayTasks.length}</strong><span>Bugun</span></div><div class="card stat"><strong>${S.tasks.filter(t=>t.done).length}</strong><span>Bajarildi</span></div></div><h2>🧠 Smart tavsiya</h2><div class="card tip">${smartAdvice()}</div><h2>Bugungi darslar · ${DAYS[day]}</h2>${lessons.length?lessons.map(l=>`<div class="card row between"><b>${esc(l.subject)}</b><span class="pill">${esc(l.time)}</span></div>`).join(''):`<div class="card empty">Bugungi jadval hali kiritilmagan.</div>`}<h2>📌 Yaqin vazifalar</h2>${pend.sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3).map(taskCard).join('')||`<div class="card empty">Hozircha vazifa yo‘q.</div>`}${ex.length?`<h2>🎯 Yaqin imtihonlar</h2>${ex.map(e=>`<div class="card"><b>${esc(e.subject)}</b><div class="muted">${dueText(left(e.date))}</div></div>`).join('')}`:''}`}
function taskCard(t){return `<div class="card task ${t.done?'done':''}"><span class="priority p${t.prio}"></span><div class="taskinfo"><div class="tasktitle">${esc(t.title)}</div><div class="taskmeta">${esc(t.subject)} · ${PRIOR[t.prio]} · ${t.done?'Bajarildi':dueText(left(t.due))}</div></div><button class="check ${t.done?'checked':''}" data-done="${t.id}">${t.done?'✓':''}</button><button class="del" data-delete="${t.id}" aria-label="O‘chirish">×</button></div>`}
function schedule(){let list=S.schedule[day]||[];return `<div class="top"><div><div class="brand">Dars jadvali</div><div class="muted">Haftalik darslaringiz</div></div></div><div class="days">${DAYS.map((d,i)=>`<button class="${i===day?'active':''}" data-day="${i}">${d.slice(0,3)}</button>`).join('')}</div>${list.length?list.map((l,i)=>`<div class="card row between"><div><b>${esc(l.subject)}</b><div class="muted">${esc(l.time)}</div></div><button class="del" data-delsched="${i}">×</button></div>`).join(''):`<div class="card empty">${DAYS[day]} uchun darslar qo‘shilmagan.</div>`}<h2>Dars qo‘shish</h2><div class="formgrid"><input id="subj" placeholder="Fan nomi"><input id="time" type="time" value="08:30"></div><button class="btn" id="addSchedule">+ Dars qo‘shish</button>`}
function tasks(){let arr=[...S.tasks].sort((a,b)=>a.done-b.done||a.due.localeCompare(b.due));let joined=S.joined;return `<div class="top"><div><div class="brand">Vazifalar</div><div class="muted">Bajarilganlarini belgilab boring ✨</div></div></div><div class="card"><h3>🏫 Sinfga parol bilan qo‘shilish</h3><div class="muted">Ustoz bergan sinf kodi va parolini kiriting.</div><div class="formgrid"><input id="joinCode" placeholder="Sinf kodi"><input id="joinPassword" type="password" placeholder="Sinf paroli"></div><button class="btn secondary" id="joinClass">Sinfga qo‘shilish</button></div>${joined.length?`<h2>📨 Sinflarim</h2>${joined.map(c=>`<div class="card"><div class="row between"><b>${esc(c.name)}</b><span class="pill">${esc(c.code)}</span></div>${c.tasks.map(t=>`<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px"><b>${esc(t.title)}</b><div class="taskmeta">${esc(t.subject)} · ${dueText(left(t.due))}</div><button class="smallbtn" data-importclass="${t.id}" data-classid="${c.id}" style="margin-top:8px">+ Vazifalarimga qo‘shish</button></div>`).join('')||`<div class="muted" style="margin-top:8px">Hali vazifa yuborilmagan.</div>`}</div>`).join('')}`:''}${arr.map(taskCard).join('')||`<div class="card empty">Vazifa yo‘q — birinchi vazifangizni qo‘shing!</div>`}<h2>Yangi vazifa</h2><div class="formgrid"><input class="wide" id="title" placeholder="Vazifa nomi"><input id="subject" placeholder="Fan"><input id="due" type="date" value="${iso(Date.now()+86400000)}"><select id="prio"><option value="3">🔴 Yuqori</option><option value="2" selected>🟠 O‘rta</option><option value="1">🔵 Past</option></select></div><button class="btn" id="addTask">Vazifani saqlash</button>`}

function exams(){let es=[...S.exams].sort((a,b)=>a.date.localeCompare(b.date));return `<div class="top"><div><div class="brand">Imtihon rejasi 🎯</div><div class="muted">Mavzularni kunlarga taqsimlang</div></div></div>${es.map(e=>{let days=Math.max(1,left(e.date)-1),plan=e.topics.length?e.topics.map((t,i)=>({date:iso(Date.now()+Math.floor(i*days/e.topics.length)*86400000),topic:t})):[];return `<div class="card"><div class="row between"><div><b>${esc(e.subject)}</b><div class="muted">${dueText(left(e.date))} · ${e.topics.length} mavzu</div></div><button class="del" data-delexam="${e.id}">×</button></div>${plan.map(p=>`<div class="topiclist"><b>${new Date(p.date+'T00:00').toLocaleDateString('uz-UZ',{day:'numeric',month:'short'})}:</b> ${esc(p.topic)}</div>`).join('')}</div>`}).join('')||`<div class="card empty">Imtihon kiritilmagan.</div>`}<h2>Imtihon qo‘shish</h2><div class="formgrid"><input id="examSub" placeholder="Fan"><input id="examDate" type="date" value="${iso(Date.now()+7*86400000)}"><input class="wide" id="topics" placeholder="Mavzular (vergul bilan)"></div><button class="btn" id="addExam">Reja yaratish</button>`}
function stats(){let done=S.tasks.filter(t=>t.done),all=S.tasks,rate=all.length?Math.round(done.length/all.length*100):0;let by={};all.forEach(t=>{by[t.subject]??={done:0,total:0};by[t.subject].total++;if(t.done)by[t.subject].done++});return `<div class="top"><div><div class="brand">Progress & yutuqlar 🏆</div><div class="muted">Kichik qadamlar — katta natijalar</div></div></div><div class="card"><div class="row between"><div><div class="muted">Umumiy bajarilish</div><strong style="font-size:34px">${rate}%</strong></div><div style="font-size:35px">${rate===100&&all.length?'🎉':'📈'}</div></div><div class="progress"><i style="width:${rate}%"></i></div><div class="muted" style="margin-top:8px">${done.length} / ${all.length} vazifa bajarildi</div></div><div class="stats"><div class="card stat"><strong>${S.xp||0}</strong><span>XP ball</span></div><div class="card stat"><strong>${level()}</strong><span>Level</span></div><div class="card stat"><strong>${streak()}</strong><span>Streak 🔥</span></div></div><h2>Fanlar bo‘yicha</h2>${Object.entries(by).map(([s,v])=>`<div class="card"><div class="row between"><b>${esc(s)}</b><span class="muted">${v.done}/${v.total}</span></div><div class="progress"><i style="width:${Math.round(v.done/v.total*100)}%"></i></div></div>`).join('')||`<div class="card empty">Vazifalar qo‘shilgach statistika ko‘rinadi.</div>`}<div class="card"><h3>🏅 Yutuqlar</h3><div class="muted">${done.length>=1?'🌱 Birinchi vazifa!':'🔒 Birinchi vazifani bajaring'} &nbsp; ${done.length>=10?'🏆 10 ta vazifa!':'🔒 10 ta vazifa bajaring'} &nbsp; ${streak()>=3?'🔥 3 kunlik streak!':'🔒 3 kun ketma-ket foydalaning'}</div></div><button class="btn secondary" id="editName">Ismni o‘zgartirish</button><button class="smallbtn" id="reset" style="width:100%;margin-top:10px">Ma’lumotlarni tozalash</button>`}
function teacher(){let cs=S.classes.filter(c=>c.ownerKey);return `<div class="top"><div><div class="brand">O‘qituvchi paneli 👩‍🏫</div><div class="muted">Parol bilan himoyalangan sinflar</div></div></div><div class="card"><h3>➕ Yangi sinf yaratish</h3><input id="newClassName" placeholder="Sinf nomi (masalan, 7-A yoki IELTS guruh)"><div class="formgrid"><input id="newClassPassword" type="password" placeholder="Sinf paroli (kamida 4 belgi)"><input id="newClassPassword2" type="password" placeholder="Parolni qayta kiriting"></div><button class="btn" id="createClass">Sinf yaratish</button></div>${cs.length?`<h2>📚 Mening sinflarim (${cs.length})</h2>${cs.map(c=>`<div class="card"><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">Sinf kodi: <strong>${esc(c.code)}</strong></div></div><button class="smallbtn" data-delclass="${c.id}">O‘chirish</button></div><div class="muted" style="margin-top:8px">Sinf paroli: •••••• (ustoz yaratgan parol)</div><h3 style="margin-top:14px">📤 Vazifa yuborish</h3><input data-ctitle="${c.id}" placeholder="Vazifa nomi"><div class="formgrid"><input data-csubject="${c.id}" placeholder="Fan"><input data-cdue="${c.id}" type="date" value="${iso(Date.now()+86400000)}"></div><button class="btn secondary" data-sendtask="${c.id}">Shu sinfga yuborish</button><h3 style="margin-top:15px">Yuborilgan vazifalar (${c.tasks.length})</h3>${c.tasks.map(t=>`<div class="row between" style="border-top:1px solid var(--line);padding-top:9px;margin-top:8px"><div class="taskinfo"><b>${esc(t.title)}</b><div class="taskmeta">${esc(t.subject)} · ${dueText(left(t.due))}</div></div><button class="del" data-delclasstask="${t.id}" data-classid="${c.id}">×</button></div>`).join('')||`<div class="muted">Hali vazifa yuborilmagan.</div>`}</div>`).join('')}`:`<div class="card empty">Hali sinf yaratilmagan. Yuqoridan yangi sinf yarating.</div>`}<div class="tip">ℹ️ Sinflar va vazifalar umumiy bazada saqlanadi: o‘quvchilar istalgan telefondan kod va parol bilan kiradi. Bu qurilmada yaratilgan sinflarni faqat shu brauzer boshqara oladi.</div>`}

function render(){let view={home,schedule,tasks,exams,stats,teacher}[S.tab];document.getElementById('app').innerHTML=view();document.getElementById('nav').innerHTML=TABS.map(([id,icon,label])=>`<button class="${S.tab===id?'active':''}" data-tab="${id}"><span>${icon}</span>${label}</button>`).join('')}
function val(id){return (document.getElementById(id)?.value||'').trim()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab){S.tab=d.tab;render();scrollTo(0,0);if(d.tab==='tasks')refreshJoined()}else if(d.importclass){let c=S.joined.find(x=>x.id===d.classid),t=c?.tasks.find(x=>x.id===d.importclass);if(t&&!S.tasks.some(x=>x.classTaskId===t.id&&x.classId===c.id))S.tasks.push({id:uid(),title:t.title,subject:t.subject,due:t.due,prio:2,done:false,classTaskId:t.id,classId:c.id});else if(t)alert('Bu vazifa allaqachon qo‘shilgan.')}else if(d.delclasstask){let c=S.classes.find(x=>x.id===d.classid);if(c){c.tasks=c.tasks.filter(t=>t.id!==d.delclasstask);pushTasks(c)}}else if(d.delclass){if(confirm('Sinf va uning vazifalarini o‘chirasizmi?')){let dc=S.classes.find(c=>c.id===d.delclass);if(dc?.ownerKey)rpc('delete_class',{p_code:dc.code,p_owner_key:dc.ownerKey}).catch(e=>alert(e.message));S.classes=S.classes.filter(c=>c.id!==d.delclass);S.joinedClasses=S.joinedClasses.filter(id=>id!==d.delclass)}}else if(d.day!==undefined){day=+d.day;render()}else if(d.done){let t=S.tasks.find(x=>x.id===d.done);if(t){t.done=!t.done;if(t.done){S.xp=(S.xp||0)+10;S.completedDates=[...(S.completedDates||[]),today()];t.completedAt=today()}else{S.xp=Math.max(0,(S.xp||0)-10);S.completedDates=(S.completedDates||[]).filter(x=>x!==t.completedAt);t.completedAt=null}}}else if(d.delete){S.tasks=S.tasks.filter(t=>t.id!==d.delete)}else if(d.delsched!==undefined){S.schedule[day].splice(+d.delsched,1)}else if(b.id==='addSchedule'){let s=val('subj');if(!s)return alert('Fan nomini kiriting');(S.schedule[day]??=[]).push({subject:s,time:val('time')||'—'});S.schedule[day].sort((a,b)=>a.time.localeCompare(b.time))}else if(b.id==='addTask'){let title=val('title'),subject=val('subject'),due=val('due');if(!title||!subject||!due)return alert('Vazifa, fan va muddatni kiriting');S.tasks.push({id:uid(),title,subject,due,prio:+val('prio'),done:false})}else if(b.id==='addExam'){let subject=val('examSub'),date=val('examDate'),topics=val('topics').split(',').map(x=>x.trim()).filter(Boolean);if(!subject||!date)return alert('Fan va imtihon sanasini kiriting');S.exams.push({id:uid(),subject,date,topics})}else if(d.delexam){S.exams=S.exams.filter(x=>x.id!==d.delexam)}else if(b.id==='joinClass'){joinRemote(val('joinCode').toUpperCase(),val('joinPassword'));return}else if(b.id==='createClass'){let name=val('newClassName'),pw=val('newClassPassword'),pw2=val('newClassPassword2');if(!name||!pw)alert('Sinf nomi va parolni kiriting.');else if(pw.length<4)alert('Parol kamida 4 belgidan iborat bo‘lsin.');else if(pw!==pw2)alert('Parollar mos kelmadi.');else{createClassRemote(name,pw);return}}else if(d.sendtask){let c=S.classes.find(x=>x.id===d.sendtask),title=document.querySelector(`[data-ctitle=\"${c.id}\"]`)?.value.trim(),subject=document.querySelector(`[data-csubject=\"${c.id}\"]`)?.value.trim(),due=document.querySelector(`[data-cdue=\"${c.id}\"]`)?.value;if(!title||!subject||!due)alert('Vazifa, fan va muddatni kiriting.');else{c.tasks.push({id:uid(),title,subject,due});pushTasks(c)}}else if(b.id==='editName'){let n=prompt('Ismingiz:',S.name||'O‘quvchi');if(n?.trim())S.name=n.trim()}else if(b.id==='reset'){if(confirm('Barcha ma’lumotlar o‘chirilsinmi?')){S={schedule:{},tasks:[],exams:[],xp:0,completedDates:[],name:'O‘quvchi',tab:'home',classes:[],joinedClasses:[],joined:[]}}}else return;save();render()});render();refreshJoined();
</script></body></html>
